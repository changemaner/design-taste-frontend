<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotherDuck — Queries, not queues</title>

    <!-- Fonts: JetBrains Mono (Aeonik Mono substitute, mono-first system), per DESIGN.md -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">

{{FONTS}}

    <style>
{{ROOT_TOKENS}}

            overflow: hidden;
        }

        /* Fixed 1920×1080 stage, uniformly scaled to viewport (letterboxed) */
        .deck-viewport {
            position: fixed; inset: 0;
            overflow: hidden;
            background: var(--color-canvas);
        }
        .deck-stage {
            position: absolute;
            left: 0; top: 0;
            width: 1920px; height: 1080px;
            transform-origin: 0 0;
        }

        .slide {
            position: absolute;
            inset: 0;
            width: 1920px; height: 1080px;
            overflow: hidden;
            display: block;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            background: var(--color-canvas);
        }
        .slide.active,
        .slide.visible {
            visibility: visible;
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            z-index: 1;
        }

        img, video, canvas, svg { max-width: 100%; max-height: 100%; }

        @media print {
            html, body { width: 1920px; height: auto; overflow: visible; background: var(--color-canvas); }
            .deck-viewport { position: static; overflow: visible; }
            .deck-stage { position: static; width: auto; height: auto; transform: none !important; }
            .slide {
                position: relative;
                display: block !important;
                visibility: visible !important;
                opacity: 1 !important;
                pointer-events: auto !important;
                width: 1920px; height: 1080px;
                break-after: page;
                page-break-after: always;
            }
            .slide:last-child { break-after: auto; page-break-after: auto; }
            .deck-chrome { display: none !important; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.2s !important;
            }
        }

        /* ═══════════ BRAND ─ 品牌组件 CSS（每套素材独立） ═══════════ */
{{BRAND_CSS}}

        /* Deck chrome — fixed to viewport, outside slide layout (safety zone 160px) */
        .deck-chrome {
            position: fixed;
            left: 0; right: 0; bottom: 24px;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 48px;
            pointer-events: none;
            font-family: var(--font-ui);
            font-size: 22px;
            color: var(--color-muted);
            letter-spacing: 0.04em;
        }
        /* Dot progress navigation — clickable, current slide solid */
        .dot-nav {
            display: flex;
            gap: var(--nav-dot-gap);
            align-items: center;
            pointer-events: auto;
            width: fit-content;
            isolation: isolate;
            color: var(--nav-pill-fg, var(--color-ink));
            /* Fallback for browsers without color-mix(). */
            background: var(--nav-pill-bg, rgba(0, 0, 0, var(--nav-pill-alpha)));
            border: 1px solid var(--nav-pill-border, rgba(0, 0, 0, var(--nav-pill-border-alpha)));
            border-radius: 9999px;
            padding: var(--nav-pill-pad-y) var(--nav-pill-pad-x);
            box-shadow: 0 2px 12px rgba(0, 0, 0, var(--nav-pill-shadow-alpha));
            backdrop-filter: blur(var(--nav-pill-blur));
            -webkit-backdrop-filter: blur(var(--nav-pill-blur));
        }
        @supports (background: color-mix(in srgb, black 10%, transparent)) {
            .dot-nav {
                background: color-mix(in srgb, currentColor var(--nav-pill-alpha), transparent);
                border-color: color-mix(in srgb, currentColor var(--nav-pill-border-alpha), transparent);
            }
        }
        /* Slides with saturated, dark, or image-led backgrounds opt into the light chrome tone. */
        .dot-nav[data-tone="dark"] {
            color: var(--nav-pill-fg-dark, var(--color-on-ink, #fff));
            background: var(--nav-pill-bg-dark, rgba(255, 255, 255, var(--nav-pill-alpha)));
            border-color: var(--nav-pill-border-dark, rgba(255, 255, 255, var(--nav-pill-border-alpha)));
            box-shadow: 0 2px 12px rgba(0, 0, 0, var(--nav-pill-shadow-alpha));
        }
        @supports (background: color-mix(in srgb, black 10%, transparent)) {
            .dot-nav[data-tone="dark"] {
                background: color-mix(in srgb, currentColor var(--nav-pill-alpha), transparent);
                border-color: color-mix(in srgb, currentColor var(--nav-pill-border-alpha), transparent);
            }
        }
        @media (prefers-reduced-transparency: reduce) {
            .dot-nav {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: var(--nav-pill-bg-solid, var(--color-canvas));
                border-color: var(--nav-pill-border-solid, currentColor);
            }
            .dot-nav[data-tone="dark"] {
                background: var(--nav-pill-bg-solid-dark, var(--color-ink));
                border-color: var(--nav-pill-border-solid-dark, currentColor);
            }
        }
        .nav-dot {
            width: var(--nav-dot-size); height: var(--nav-dot-size);
            color: inherit;
            border-radius: 50%;
            border: 2px solid currentColor;
            background: transparent;
            padding: 0;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .nav-dot.active {
            background: currentColor;
            transform: scale(var(--nav-active-scale));
        }
        .nav-dot:hover { transform: scale(var(--nav-hover-scale)); }
        /* Speaker notes — N toggles an overlay of the current slide's note */
        .speaker-note {
            display: none;
            position: fixed;
            left: 50%; bottom: 96px;
            transform: translateX(-50%);
            z-index: 2000;
            max-width: 780px;
            max-height: 240px;
            overflow: auto;
            padding: 20px 28px;
            border-radius: 16px;
            font-family: var(--font-ui);
            font-size: 24px;
            line-height: 1.6;
            background: var(--color-ink);
            color: var(--color-on-ink);
            box-shadow: 0 16px 40px rgba(0,0,0,0.18);
            pointer-events: none;
            text-align: left;
        }


        /* ════════════════════════════════════════════════════════════
           CONFIG — 克隆后改这里即可自定义整套 UI（改完刷新即生效）
           默认值 = 已验证的编辑稿 Expo 手感（动效）+ 自适应胶囊导航
           ════════════════════════════════════════════════════════════ */
        :root {
            /* —— 动效 MOTION —— */
            --motion-ease: cubic-bezier(0.16, 1, 0.3, 1);  /* 入场缓动：编辑稿 Expo（落地平缓） */
            --motion-duration: 0.7s;    /* 元素入场时长（0.5~0.9s 常用，越大越慢） */
            --motion-distance: 28px;    /* 入场上移距离（16~40px，越大越明显） */
            --motion-stagger-step: 0.12s; /* 交错步长（0.08 更快 / 0.16 更分明） */

            /* —— 底部胶囊导航 NAV —— */
            --nav-dot-size: 14px;       /* 圆点直径 */
            --nav-dot-gap: 18px;        /* 圆点间距 */
            --nav-pill-pad-y: 14px;     /* 胶囊上下内边距（越高胶囊越高） */
            --nav-pill-pad-x: 28px;     /* 胶囊左右内边距（越宽胶囊越长） */
            --nav-pill-alpha: 0.08;     /* 胶囊背景透明度（0 无底 / 0.15 更实） */
            --nav-pill-border-alpha: 0.28; /* 胶囊描边透明度 */
            --nav-pill-shadow-alpha: 0.12; /* 胶囊阴影透明度（复杂背景可略增） */
            --nav-pill-blur: 10px;      /* 胶囊背景模糊（照片/渐变背景建议 8~14px） */
            --nav-pill-fg: var(--color-ink); /* 浅底圆点/前景色：必须接素材正文色 */
            --nav-pill-fg-dark: var(--color-on-ink, #fff); /* 深底圆点/前景色 */
            --nav-pill-bg: rgba(0, 0, 0, var(--nav-pill-alpha)); /* 浅底降级背景 */
            --nav-pill-border: rgba(0, 0, 0, var(--nav-pill-border-alpha)); /* 浅底降级描边 */
            --nav-pill-bg-dark: rgba(255, 255, 255, var(--nav-pill-alpha)); /* 深底降级背景 */
            --nav-pill-border-dark: rgba(255, 255, 255, var(--nav-pill-border-alpha)); /* 深底降级描边 */
            --nav-pill-bg-solid: var(--color-canvas); /* 减少透明度时的不透明背景 */
            --nav-pill-border-solid: var(--color-ink); /* 减少透明度时的描边 */
            --nav-pill-bg-solid-dark: var(--color-ink); /* 深色页减少透明度时的不透明背景 */
            --nav-pill-border-solid-dark: var(--color-on-ink, #fff); /* 深色页减少透明度时的描边 */
            --nav-active-scale: 1.15;   /* 当前页圆点放大倍数 */
            --nav-hover-scale: 1.35;    /* 悬停圆点放大倍数 */

            /* —— 布局 LAYOUT —— */
            --safety-bottom: 160px;     /* 底部安全区（勿小于胶囊高度） */
            --frame-pad-top: 112px;     /* 内容区上内边距 */
            --frame-pad-x: 120px;       /* 内容区左右内边距（含 wordmark 对齐） */

            /* —— 数据可视化 DATA-VIZ —— */
            --chart-draw-duration: 1.4s; /* 折线/环形图描边绘制时长 */
        }


        /* Reveal — transition-driven staged entrance, driven by .visible */
        .reveal {
            opacity: 0;
            transform: translateY(var(--motion-distance));
            transition: opacity var(--motion-duration) var(--motion-ease),
                        transform var(--motion-duration) var(--motion-ease);
        }
        .slide.visible .reveal { opacity: 1; transform: translateY(0); }
        .slide.visible .reveal.d1 { transition-delay: calc(var(--motion-stagger-step) * 1); }
        .slide.visible .reveal.d2 { transition-delay: calc(var(--motion-stagger-step) * 2); }
        .slide.visible .reveal.d3 { transition-delay: calc(var(--motion-stagger-step) * 3); }
        .slide.visible .reveal.d4 { transition-delay: calc(var(--motion-stagger-step) * 4); }
        /* Interaction stays snappy after entrance */
        .slide.visible [class*="btn"], .slide.visible .artifact, .slide.visible .link-arrow {
            transition: opacity 0.2s ease, transform 0.25s ease,
                        box-shadow 0.25s ease, background-color 0.2s ease;
        }
    </style>
    </style>
</head>
<body>

<div class="deck-viewport">
    <main class="deck-stage" id="deckStage">

{{SLIDES}}

<!-- Deck chrome — fixed to viewport, outside the slide design system -->
<div class="speaker-note" id="speakerNote"></div>
<div class="deck-chrome">
    <div class="dot-nav" id="dotNav" role="navigation" aria-label="Slide navigation"></div>
</div>


<script>
    /* ===========================================
       SLIDE PRESENTATION CONTROLLER
       =========================================== */
    class SlidePresentation {
        constructor() {
            this.slides = document.querySelectorAll('.slide');
            this.currentSlide = 0;
            this.stage = document.getElementById('deckStage');
            this.dotNav = document.getElementById('dotNav');
            this.notesOn = false;
            this.noteEl = document.getElementById('speakerNote');
            this.setupStageScale();
            this.setupDotNav();
            this.setupKeyboardNav();
            this.setupTouchNav();
            this.initFromQuery();
            this.showSlide(this.currentSlide);
        }

        /* Uniform stage scale: 1920×1080 → viewport, letterboxed */
        setupStageScale() {
            const scale = () => {
                const factor = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
                const x = (window.innerWidth - 1920 * factor) / 2;
                const y = (window.innerHeight - 1080 * factor) / 2;
                this.stage.style.transform = `translate(${x}px, ${y}px) scale(${factor})`;
            };
            scale();
            window.addEventListener('resize', scale);
        }

        /* Dot navigation: one clickable dot per slide */
        setupDotNav() {
            if (!this.dotNav) return;
            this.slides.forEach((slide, i) => {
                const d = document.createElement('button');
                d.className = 'nav-dot';
                d.type = 'button';
                d.setAttribute('aria-label', 'Go to slide ' + (i + 1));
                d.title = 'Slide ' + (i + 1);
                d.addEventListener('click', () => this.showSlide(i));
                this.dotNav.appendChild(d);
            });
        }

        /* Keyboard: arrows, space, page up/down, home/end */
        setupKeyboardNav() {
            document.addEventListener('keydown', (e) => {
                if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); this.showSlide(this.currentSlide + 1); }
                else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); this.showSlide(this.currentSlide - 1); }
                else if (e.key === 'Home') { this.showSlide(0); }
                else if (e.key === 'End') { this.showSlide(this.slides.length - 1); }
                else if (e.key === 'n' || e.key === 'N') { this.toggleNotes(); }
            });
        }

        /* Touch swipe */
        setupTouchNav() {
            let startX = null;
            document.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
            document.addEventListener('touchend', (e) => {
                if (startX === null) return;
                const dx = e.changedTouches[0].clientX - startX;
                if (Math.abs(dx) > 60) this.showSlide(this.currentSlide + (dx < 0 ? 1 : -1));
                startX = null;
            });
        }

        /* Speaker notes: N toggles the overlay, page turn refreshes content */
        toggleNotes() {
            this.notesOn = !this.notesOn;
            if (this.noteEl) this.noteEl.style.display = this.notesOn ? 'block' : 'none';
            this.updateNotes();
        }
        updateNotes() {
            if (!this.noteEl) return;
            const cur = this.slides[this.currentSlide];
            const n = cur ? cur.getAttribute('data-note') : null;
            this.noteEl.textContent = n || '（本页无讲者备注 · N 关闭）';
        }

        /* Deep-link support: ?slide=N */
        initFromQuery() {
            const m = location.search.match(/[?&]slide=(\d+)/);
            if (m) this.currentSlide = Math.max(0, Math.min(parseInt(m[1], 10), this.slides.length - 1));
        }

        showSlide(index) {
            this.currentSlide = Math.max(0, Math.min(index, this.slides.length - 1));
            this.slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === this.currentSlide);
                slide.classList.toggle('visible', i === this.currentSlide);
            });
            if (this.dotNav) {
                const activeSlide = this.slides[this.currentSlide];
                const tone = activeSlide ? activeSlide.getAttribute('data-nav-tone') : null;
                if (tone === 'dark') this.dotNav.dataset.tone = 'dark';
                else this.dotNav.removeAttribute('data-tone');
                this.dotNav.querySelectorAll('.nav-dot').forEach((d, i) => {
                    d.classList.toggle('active', i === this.currentSlide);
                });
            }
            this.updateNotes();
        }
    }

    new SlidePresentation();
</script>
</body>
